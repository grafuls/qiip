<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ node_id }} — QUADS Node Detail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/dashboard.css') }}">
    <script>var __t=localStorage.getItem('theme')||'dark';document.documentElement.dataset.theme=__t;</script>
</head>
<body>
    <nav class="top-bar" aria-label="Primary">
        <div class="brand">
            <span class="brand-icon" aria-hidden="true">Q</span>
            QUADS
            <span class="brand-sep" aria-hidden="true"></span>
            <span class="brand-sub">Inference Proxy</span>
        </div>
        <button class="theme-toggle" onclick="let t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('theme',t);this.textContent=t==='dark'?'☀️':'🌙'" aria-label="Toggle theme"><script>document.write(__t==='dark'?'☀️':'🌙')</script></button>
    </nav>

    <div class="dashboard">
        <header class="dashboard-header">
            <div>
                <p style="margin:0 0 0.25rem"><a href="/dashboard">&larr; Back to fleet</a></p>
                <h1 id="node-title">{{ node_id }}</h1>
                <p id="node-state">Loading...</p>
            </div>
            <div class="header-right">
                <p id="last-updated"></p>
            </div>
        </header>

        <main>
            <section class="card">
                <h2 class="card-title">Node Info</h2>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th scope="col">GPU Vendor</th>
                                <th scope="col">GPU Model</th>
                                <th scope="col">Endpoint</th>
                                <th scope="col">Model</th>
                                <th scope="col">State</th>
                                <th scope="col">Active Connections</th>
                                <th scope="col">Circuit Breaker</th>
                                <th scope="col">Requests</th>
                                <th scope="col">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="node-info-body">
                            <tr><td colspan="9">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <section class="card" id="tasks-panel">
                <h2 class="card-title">Provisioning Tasks</h2>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th scope="col">Current Step</th>
                                <th scope="col">Status</th>
                                <th scope="col">Error</th>
                                <th scope="col">Started</th>
                                <th scope="col">Updated</th>
                            </tr>
                        </thead>
                        <tbody id="tasks-table-body">
                            <tr><td colspan="5">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="toast-container"></div>

    <footer>
        <p>QUADS Inference Proxy</p>
    </footer>

    <script>
        const POLL_INTERVAL_MS = {{ poll_interval * 1000 }};
        const NODE_ID = "{{ node_id }}";
    </script>
    <script src="{{ url_for('static', path='js/node_detail.js') }}"></script>
</body>
</html>
