[project]
name = "inference-proxy"
version = "0.1.0"
description = "QUADS LLM Inference Proxy - routes requests to vLLM nodes"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.135,<1.0",
    "uvicorn[standard]>=0.45",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.14",
    "structlog>=26.1.0",
    "etcd3gw>=2.5.0",
    "httpx>=0.28,<1.0",
    "httpx-sse>=0.4.3",
    "jinja2>=3.1",
    "asyncssh>=2.20,<3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15",
    "mypy>=2.1",
    "pytest>=8.0",
    "pytest-asyncio>=1.4",
    "pytest-httpx>=0.36",
    "coverage>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
